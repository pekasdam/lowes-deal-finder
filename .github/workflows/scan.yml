name: Scan Lowe's Deals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: lowes-hourly-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan current Lowe's deals
        run: python scraper/scan.py
      - name: Save fresh deals
        run: |
          if git diff --quiet -- data/deals.json data/history.json; then exit 0; fi
          git config user.name "lowes-deal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/history.json
          git commit -m "Update Lowe's deals"
          git push
